<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti</title>
<style>

  /* =========================================================
     ZONA DE PERSONALIZACIÓN
     Cambia estos valores por los tuyos.
     ========================================================= */

  :root{
    --nombre-ella: "Mi Niña Preciosa, Mafer <3";
    --fecha-especial: "26/11";

    /* paleta — puedes cambiar estos tonos si quieres otro ánimo */
    --amarillo-fuerte: #d9a01d;
    --amarillo-suave:  #f2c94c;
    --tierra-oscura:   #2e2410;
    --tierra-media:    #6b5a2e;
    --crema:           #fbf6e8;
    --crema-tarjeta:   #fffdf6;
  }

  /* Rutas de las 3 fotos. Crea una carpeta "fotos" junto a este
     archivo .html y pon ahí tus imágenes con estos nombres. */
  .foto1 { background-image: url("./fotos/foto1.jpg"); }
  .foto2 { background-image: url("./fotos/foto2.jpg"); }
  .foto3 { background-image: url("./fotos/foto3.jpg"); }

  /* Texto del mensaje: bájalo hasta el <p class="linea"> en el HTML
     y cámbialo ahí, no hace falta tocar el CSS. */

  /* =========================================================
     DISEÑO — puedes tocarlo si sabes CSS, no hace falta.
     ========================================================= */

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    min-height: 100vh;
    background:
      radial-gradient(circle at 20% 15%, rgba(217,160,29,0.10), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(217,160,29,0.08), transparent 45%),
      var(--crema);
    font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    position: relative;
    overflow-x: hidden;
  }

  /* textura sutil de puntos, para que el fondo no sea plano */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: radial-gradient(rgba(107,90,46,0.10) 1px, transparent 1px);
    background-size: 22px 22px;
    pointer-events: none;
    z-index: 0;
  }

  /* --- flores cayendo de fondo --- */
  .flor {
    position: fixed;
    top: -10%;
    color: var(--amarillo-fuerte);
    user-select: none;
    pointer-events: none;
    animation: caer linear infinite;
    z-index: 0;
    opacity: 0.55;
  }

  @keyframes caer {
    0%   { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(115vh) rotate(360deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .flor { animation: none; display: none; }
  }

  /* --- tarjeta central --- */
  .tarjeta {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 460px;
    background: var(--crema-tarjeta);
    border: 1px solid rgba(107,90,46,0.18);
    border-radius: 2px;
    padding: 52px 34px 44px 34px;
    text-align: center;
    box-shadow:
      0 1px 2px rgba(46,36,16,0.06),
      0 18px 40px -18px rgba(46,36,16,0.35);
  }

  /* pequeño ornamento floral arriba de la tarjeta, en vez de un ícono genérico */
  .ornamento {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 22px;
    color: var(--amarillo-fuerte);
    font-size: 13px;
    letter-spacing: 6px;
  }

  .para-quien {
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--tierra-media);
    margin-bottom: 10px;
  }

  .titulo-nombre {
    font-size: clamp(30px, 7vw, 44px);
    color: var(--tierra-oscura);
    font-weight: 400;
    line-height: 1.15;
    margin-bottom: 8px;
  }

  .titulo-nombre::before { content: var(--nombre-ella); }

  .subfecha {
    font-size: 13px;
    color: var(--tierra-media);
    margin-bottom: 38px;
    font-style: italic;
  }

  .subfecha::before { content: var(--fecha-especial); }

  .linea-divisoria {
    width: 46px;
    height: 1px;
    background: var(--amarillo-fuerte);
    margin: 0 auto 38px auto;
    opacity: 0.6;
  }

  /* --- flor interactiva --- */
.revelar {
    width: 150px;
    height: 165px;
    margin: 0 auto 18px auto;
    cursor: pointer;
    transition: transform 0.35s cubic-bezier(.34,1.56,.64,1);
  }

  .revelar:hover { transform: scale(1.08) rotate(4deg); }
  .revelar.abierta { transform: scale(1.15) rotate(8deg); }

  .revelar svg { width: 100%; height: 100%; }

  .instruccion {
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--tierra-media);
    margin-bottom: 36px;
    transition: opacity 0.4s ease;
  }

  /* --- mensaje --- */
  .mensaje {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height 0.7s ease, opacity 0.6s ease, margin 0.7s ease;
    margin-bottom: 0;
  }

  .mensaje.visible {
    max-height: 320px;
    opacity: 1;
    margin-bottom: 34px;
  }

  .fotos {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height 0.8s ease 0.6s, opacity 0.7s ease 0.6s;
  }

  .fotos.visible {
    max-height: 320px;
    opacity: 1;
  }
  .foto {
    width: 118px;
    height: 148px;
    background-size: cover;
    background-position: center;
    background-color: #f1e9cf;
    border: 4px solid #fff;
    box-shadow: 0 6px 18px rgba(46,36,16,0.22);
    transform: rotate(-4deg);
  }
  .foto:nth-child(2) { transform: rotate(3deg); margin-top: 14px; }
  .foto:nth-child(3) { transform: rotate(-2deg); }

  .foto:hover { transform: rotate(0deg) scale(1.03); transition: transform 0.3s ease; }
  .firma {
    margin-top: 30px;
    font-size: 13px;
    font-style: italic;
    color: var(--tierra-media);
    opacity: 0;
    transition: opacity 0.8s ease 1.1s;
  }

  .firma.visible {
    opacity: 1;
  }
</style>
</head>
<body>

  <div class="tarjeta">
    <div class="ornamento">✿ ❀ ✿</div>
    <p class="para-quien">PARA</p>
    <h1 class="titulo-nombre"></h1>
    <p class="subfecha"></p>
    <div class="linea-divisoria"></div>

        <div class="revelar" id="revelar" title="Toca el ramo">
      <svg viewBox="0 0 140 160">
        <!-- tallos -->
        <g stroke="#5b7a3a" stroke-width="2.5" fill="none" stroke-linecap="round">
          <path d="M70 150 C 68 120, 62 95, 50 78"/>
          <path d="M70 150 C 69 118, 68 90, 68 66"/>
          <path d="M70 150 C 72 120, 78 95, 90 78"/>
          <path d="M70 150 C 70 122, 55 100, 38 90"/>
          <path d="M70 150 C 70 122, 85 100, 102 90"/>
        </g>

        <!-- hojas -->
        <g fill="#6a8f42">
          <path d="M58 108 C 48 104, 42 96, 44 88 C 54 90, 60 98, 58 108 Z"/>
          <path d="M82 108 C 92 104, 98 96, 96 88 C 86 90, 80 98, 82 108 Z"/>
        </g>

        <!-- lazo -->
        <g fill="var(--tierra-oscura)">
          <path d="M55 148 L70 138 L85 148 L70 156 Z"/>
        </g>

        <!-- flores del ramo -->
        <g id="flor-a" transform="translate(50,78)">
          <g fill="var(--amarillo-suave)" stroke="var(--amarillo-fuerte)" stroke-width="1.2">
            <ellipse cx="0" cy="-11" rx="8" ry="11"/>
            <ellipse cx="0" cy="11" rx="8" ry="11"/>
            <ellipse cx="-11" cy="0" rx="11" ry="8"/>
            <ellipse cx="11" cy="0" rx="11" ry="8"/>
          </g>
          <circle r="6" fill="var(--tierra-oscura)"/>
        </g>

        <g id="flor-b" transform="translate(68,60)">
          <g fill="var(--amarillo-fuerte)" stroke="#b5811a" stroke-width="1.2">
            <ellipse cx="0" cy="-14" rx="10" ry="14"/>
            <ellipse cx="0" cy="14" rx="10" ry="14"/>
            <ellipse cx="-14" cy="0" rx="14" ry="10"/>
            <ellipse cx="14" cy="0" rx="14" ry="10"/>
          </g>
          <circle r="7.5" fill="var(--tierra-oscura)"/>
        </g>

        <g id="flor-c" transform="translate(90,78)">
          <g fill="var(--amarillo-suave)" stroke="var(--amarillo-fuerte)" stroke-width="1.2">
            <ellipse cx="0" cy="-11" rx="8" ry="11"/>
            <ellipse cx="0" cy="11" rx="8" ry="11"/>
            <ellipse cx="-11" cy="0" rx="11" ry="8"/>
            <ellipse cx="11" cy="0" rx="11" ry="8"/>
          </g>
          <circle r="6" fill="var(--tierra-oscura)"/>
        </g>

        <g id="flor-d" transform="translate(38,90) scale(0.8)">
          <g fill="var(--amarillo-fuerte)" stroke="#b5811a" stroke-width="1.2">
            <ellipse cx="0" cy="-11" rx="8" ry="11"/>
            <ellipse cx="0" cy="11" rx="8" ry="11"/>
            <ellipse cx="-11" cy="0" rx="11" ry="8"/>
            <ellipse cx="11" cy="0" rx="11" ry="8"/>
          </g>
          <circle r="6" fill="var(--tierra-oscura)"/>
        </g>

        <g id="flor-e" transform="translate(102,90) scale(0.8)">
          <g fill="var(--amarillo-suave)" stroke="var(--amarillo-fuerte)" stroke-width="1.2">
            <ellipse cx="0" cy="-11" rx="8" ry="11"/>
            <ellipse cx="0" cy="11" rx="8" ry="11"/>
            <ellipse cx="-11" cy="0" rx="11" ry="8"/>
            <ellipse cx="11" cy="0" rx="11" ry="8"/>
          </g>
          <circle r="6" fill="var(--tierra-oscura)"/>
        </g>
      </svg>
    </div>

    <p class="instruccion" id="instruccion">TOCA LA FLOR</p>

    <div class="mensaje" id="mensaje">
      <!-- Cambia el texto de aquí abajo por tu mensaje -->
        <p class="linea">
        Mi Chiquita Hermosa <br>
        Eres lo más lindo que me ha pasado en la vida, eres mi alegria y mi vida entera. Te amo con todo mi corazoncito❤️
        </p>
    </div>

    <div class="fotos" id="fotos">
      <div class="foto foto1"></div>
      <div class="foto foto2"></div>
      <div class="foto foto3"></div>
      
    </div>
    <p class="firma" id="firma">Con todo mi cariño</p>
  </div>

  <script>
    const simbolos = ["✿", "❀", "✾"];
    const total = 18;
    for (let i = 0; i < total; i++) {
      const f = document.createElement("div");
      f.className = "flor";
      f.textContent = simbolos[Math.floor(Math.random() * simbolos.length)];
      f.style.left = Math.random() * 100 + "vw";
      f.style.fontSize = (14 + Math.random() * 16) + "px";
      f.style.animationDuration = (8 + Math.random() * 10) + "s";
      f.style.animationDelay = (Math.random() * 10) + "s";
      document.body.appendChild(f);
    }

    const revelar = document.getElementById("revelar");
    const mensaje = document.getElementById("mensaje");
    const fotos = document.getElementById("fotos");
    const instruccion = document.getElementById("instruccion");
    let revelado = false;

    const firma = document.getElementById("firma");

    revelar.addEventListener("click", () => {
      revelado = !revelado;
      revelar.classList.toggle("abierta", revelado);
      mensaje.classList.toggle("visible", revelado);
      fotos.classList.toggle("visible", revelado);
      firma.classList.toggle("visible", revelado);
      instruccion.style.opacity = revelado ? "0" : "1";
    });
  </script>

</body>
</html>
